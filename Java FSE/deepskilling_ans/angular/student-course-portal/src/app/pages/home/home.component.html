<div class="home-container">
  <h1>{{ portalName }}</h1>
  <p class="description">Welcome to the student course management dashboard. Explore active courses, manage your enrollment, and check grade statuses.</p>
  <div class="action-card">
    <button class="btn btn-primary" [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p *ngIf="message" class="enroll-message">{{ message }}</p>
  </div>
  <div class="search-section">
    <label for="home-search">Quick Search:</label>
    <input id="home-search" type="text" [(ngModel)]="searchTerm" placeholder="Search courses or keywords...">
    <p *ngIf="searchTerm" class="search-live">Searching for: {{ searchTerm }}</p>
  </div>
  <app-notification></app-notification>
  <div class="stats-row">
    <div class="stat-card">
      <h3>Courses Available</h3>
      <p class="stat-value">{{ availableCoursesCount || 12 }}</p>
    </div>
    <div class="stat-card">
      <h3>Enrolled</h3>
      <p class="stat-value">3</p>
    </div>
    <div class="stat-card">
      <h3>GPA</h3>
      <p class="stat-value">3.8</p>
    </div>
  </div>
</div>
